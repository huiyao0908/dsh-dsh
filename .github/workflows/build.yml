name: Build dsh-ios

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # 第一个任务：在 Ubuntu 上跑 Docker 构造完美的 Linux 环境
  # ==========================================
  build-alpine:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QEMU for arm64
      uses: docker/setup-qemu-action@v3

    - name: Build Rootfs inside Docker
      run: |
        # 使用原生的 Linux ARM64 容器执行打包，绝不会报 dyld 崩溃
        docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/work -w /work alpine:latest sh -c "
          apk add --no-cache nodejs npm bash make python3 g++ clang git curl
          # 修补 EBUSY 和时间相关的 C 语言缺失头文件
          find . -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i '1s/^/#include <errno.h>\n#include <time.h>\n/' {} \;
          make rootfs || true
        "

    - name: Upload Rootfs Tar
      uses: actions/upload-artifact@v4
      with:
        name: rootfs-tar
        path: ish-arm64/build-arm64-release/rootfs.tar.gz

  # ==========================================
  # 第二个任务：在 macOS 上极简编译 Xcode 项目并打包 IPA
  # ==========================================
  build-ios:
    needs: build-alpine
    runs-on: macos-14
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download Rootfs Tar
      uses: actions/download-artifact@v4
      with:
        name: rootfs-tar
        path: ish-arm64/build-arm64-release/

    - name: Compile Xcode Project
      run: |
        # 直接编译 Xcode，因为 rootfs 已经由第一个任务完美生成
        xcodebuild -project DSH.xcodeproj -scheme DSH -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DSH.app Payload/
        zip -r DSH-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSH-Unsigned-IPA
        path: DSH-Unsigned.ipa
