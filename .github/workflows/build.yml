name: Build dsh-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Environment
      run: |
        # 安装必要的工具和底层库
        brew install meson ninja lld libarchive sqlite3
        echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

    - name: Build Rootfs
      run: |
        # 【第一步：地毯式轰炸 C 语言语法错误】
        python3 -c '
        import os
        import re
        for root, dirs, files in os.walk("."):
            for file in files:
                if file.endswith(".c") or file.endswith(".h"):
                    file_path = os.path.join(root, file)
                    with open(file_path, "r") as f:
                        code = f.read()
                    code = re.sub(r"(static\s+_Atomic\([^)]+\)\s+\w+)\s*=\s*(NULL|0);", r"\1;", code)
                    code = code.replace("static void ish_set_timer_tick_hook", "void ish_set_timer_tick_hook")
                    with open(file_path, "w") as f:
                        f.write(code)
        '
        
        # 【第二步：忽略警告，让主程序先编出核心库】
        find . -type f \( -name "*.txt" -o -name "*.mk" -o -name "*.build" -o -name "*.ninja" -o -name "Makefile" \) -exec sed -i '' 's/-Werror//g' {} \;
        export CFLAGS="-Wno-everything -w"
        export CXXFLAGS="-Wno-everything -w"
        make rootfs || true
        
        # 【第三步：使用 AI 提供的 -include 魔法，强行预包含头文件编译工具】
        cd ish-arm64
        mkdir -p build-arm64-release/tools
        SRC_FILE=$(find . -name "fakefsify.c" | head -n 1)
        echo "发现源码文件: $SRC_FILE"
        
        if [ -n "$SRC_FILE" ]; then
          cc -std=gnu11 -D_GNU_SOURCE -D_DARWIN_C_SOURCE \
            -Wno-implicit-function-declaration \
            -I. -Ikernel -Ifs -Iemu -Iutil \
            -I$(brew --prefix libarchive)/include -I$(brew --prefix sqlite3)/include \
            -include errno.h -include time.h -include pthread.h \
            -include misc.h -include util/sync.h \
            $SRC_FILE build-arm64-release/libfakefs.a \
            -o build-arm64-release/tools/fakefsify \
            -L$(brew --prefix libarchive)/lib -L$(brew --prefix sqlite3)/lib \
            -lm -lpthread -larchive -lsqlite3 || true
        fi
        cd ..
        
        # 【第四步：工具就位，最后一次打包】
        make rootfs

    - name: Build Xcode Project
      run: |
        xcodebuild -project DSH.xcodeproj -scheme DSH -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DSH.app Payload/
        zip -r DSH-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSH-Unsigned-IPA
        path: DSH-Unsigned.ipa
