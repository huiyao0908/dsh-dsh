name: Build dsh-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Environment
      run: |
        brew install meson ninja lld
        echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

    - name: Build Rootfs
      run: |
        # 暴力替换所有可能带有 -Werror 的地方
        find . -type f \( -name "*.txt" -o -name "*.mk" -o -name "*.build" -o -name "*.ninja" -o -name "Makefile" -o -name "*.c" -o -name "*.h" \) -exec sed -i '' 's/-Werror//g' {} \;
        
        # 强行设置编译器参数，忽略一切报错和警告
        export CFLAGS="-Wno-everything -w"
        export CXXFLAGS="-Wno-everything -w"
        export CC="clang -Wno-everything -w"
        export CXX="clang++ -Wno-everything -w"
        
        make rootfs

    - name: Build Xcode Project
      run: |
        xcodebuild -project DSH.xcodeproj -scheme DSH -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DSH.app Payload/
        zip -r DSH-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSH-Unsigned-IPA
        path: DSH-Unsigned.ipa
