name: Build dsh-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        run: |
          brew install meson ninja lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          sudo gem install xcodeproj

      - name: Apply source patches
        run: |
          set -eu
          # 1) Apple Clang: _Atomic 静态变量不能用 = NULL 初始化
          sed -i '' -E 's/^static _Atomic\(([^)]*)\) ([A-Za-z0-9_]+) = NULL;/static _Atomic(\1) \2;/' \
            ish-arm64/fs/fake.c ish-arm64/kernel/calls.c ish-arm64/kernel/fork.c
          # 2) 主机名过长会溢出
          sed -i '' 's|strcpy(uts->hostname, hostname);|snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);|' \
            ish-arm64/kernel/uname.c
          # 检查补丁是否生效
          grep -n "static _Atomic" ish-arm64/fs/fake.c ish-arm64/kernel/calls.c ish-arm64/kernel/fork.c
          grep -n "hostname" ish-arm64/kernel/uname.c

      - name: Build emulator and rootfs
        shell: bash
        run: |
          set -o pipefail
          make emulator 2>&1 | tee emulator-build.log
          make rootfs 2>&1 | tee rootfs-build.log
          ls -lh build/root.tar.gz

      - name: Archive unsigned
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DSH.xcodeproj -scheme DSH -configuration Release \
            -archivePath build/DSH.xcarchive \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            DSH_DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/DSH.xcarchive/Products/Applications/DSH.app"
          test -d "$APP"
          test ! -e "$APP/_CodeSignature"
          test ! -e "$APP/embedded.mobileprovision"
          rm -rf build/Payload build/DSH-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr DSH-unsigned.ipa Payload
          unzip -tq DSH-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
          if-no-files-found: error

      - name: Crash reports (on failure)
        if: failure()
        run: cat ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -300 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            emulator-build.log
            rootfs-build.log
            xcodebuild.log
          if-no-files-found: ignore
