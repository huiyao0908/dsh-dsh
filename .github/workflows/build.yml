name: Build dsh-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Environment
      run: |
        brew install meson ninja lld
        echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

    - name: Build Rootfs
      run: |
        # 【第一步：地毯式轰炸 C 语言语法错误】
        python3 -c '
        import os
        import re
        for root, dirs, files in os.walk("."):
            for file in files:
                if file.endswith(".c") or file.endswith(".h"):
                    file_path = os.path.join(root, file)
                    with open(file_path, "r") as f:
                        code = f.read()
                    code = re.sub(r"(static\s+_Atomic\([^)]+\)\s+\w+)\s*=\s*(NULL|0);", r"\1;", code)
                    code = code.replace("static void ish_set_timer_tick_hook", "void ish_set_timer_tick_hook")
                    with open(file_path, "w") as f:
                        f.write(code)
        '
        
        # 【第二步：强行忽略警告】
        find . -type f \( -name "*.txt" -o -name "*.mk" -o -name "*.build" -o -name "*.ninja" -o -name "Makefile" \) -exec sed -i '' 's/-Werror//g' {} \;
        export CFLAGS="-Wno-everything -w"
        export CXXFLAGS="-Wno-everything -w"
        
        # 【第三步：让内核先跑完（报错也继续）】
        make rootfs || true
        
        # 【第四步：强行单独编译 fakefsify 工具并塞进去】
        cd ish-arm64
        meson setup build-tools -Dguest_arch=arm64 -Dbuildtype=release || true
        ninja -C build-tools fakefsify || ninja -C build-tools tools/fakefsify || true
        
        # 全方位无死角寻找并搬运
        find . -name "fakefsify" -type f -exec cp {} build-arm64-release/tools/ \; || true
        cd ..
        
        # 【第五步：万事俱备，最后一次打包】
        make rootfs

    - name: Build Xcode Project
      run: |
        xcodebuild -project DSH.xcodeproj -scheme DSH -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DSH.app Payload/
        zip -r DSH-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSH-Unsigned-IPA
        path: DSH-Unsigned.ipa
